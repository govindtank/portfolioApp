name: portfolio
description: "A modern portfolio application built with Flutter"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  responsive_framework: ^1.5.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.1.12
  shared_preferences: ^2.2.3
  provider: ^6.1.5+1
  http: ^1.2.1
  animated_text_kit: ^4.2.2
  carousel_slider: ^4.1.0
  lottie: ^3.1.0
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
    - assets/resume/
